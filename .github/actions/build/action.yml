name: Build
description: >
  Builds the desktop app (Wails) for one target into build/bin. Shared by
  CI and the release workflow. The server has its own archives
  (release/server.sh, 8.17).

inputs:
  platform:
    description: Wails platform, e.g. linux/amd64, darwin/universal.
    required: true
  tags:
    description: Go build tags, e.g. "embed cardimages webkit2_41".
    required: true
  version:
    description: App version stamped into the app.
    required: true
  node-version:
    description: Node.js version for the frontend.
    required: true
  wails-version:
    description: Wails CLI version.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.work
        cache-dependency-path: "**/go.sum"
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install Wails Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
    - name: Install Wails CLI
      shell: bash
      run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ inputs.wails-version }}
    # The release version goes into the app's product info (8.3):
    # Info.plist and the Windows file details (19.47). They want numbers
    # only, so a suffix is dropped (1.2.3-test gives 1.2.3) and a CI
    # build (ci-<sha>) gives 0.0.0.
    - name: Stamp the product version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="${VERSION%%-*}"
        [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || v=0.0.0
        node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wails.json"));c.info.productVersion=process.argv[1];fs.writeFileSync("wails.json",JSON.stringify(c,null,2)+"\n")' "$v"
    # The images submodule prepares its files for embedding (8.29).
    - name: Prepare card images
      if: contains(inputs.tags, 'cardimages')
      shell: bash
      run: go generate ./pkg/card_db/images
    - name: Build app
      shell: bash
      run: |
        wails build -platform "${{ inputs.platform }}" -tags "${{ inputs.tags }}" \
          -ldflags "-X github.com/FourSoulsRepo/four_souls/internal/version.App=${{ inputs.version }}"
