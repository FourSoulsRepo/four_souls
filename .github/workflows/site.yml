name: Rules website

# The rules website on GitHub Pages (ADR 026, 12.3): every push to main
# deploys it (owner, 2026-11-06); a release tag may take over later.
# make site gates the deploy on the size budget and the smoke test.
# No card images: the site never has them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    name: Rules website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Tool versions
        shell: bash
        run: grep '^[A-Z_]*=' scripts/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the site
        shell: bash
        run: make site VERSION="main-${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist-site
      - id: deploy
        uses: actions/deploy-pages@v4
