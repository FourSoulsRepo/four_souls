name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  WAILS_VERSION: "v2.16.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        run: make build TAGS=webkit2_41
      - name: Vet
        run: make vet TAGS=webkit2_41
      - name: Test
        run: make test TAGS=webkit2_41

  go-images:
    name: Go tests with card images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Card images
        id: images
        uses: ./.github/actions/card-images
        with:
          ssh-key: ${{ secrets.CARD_DB_DEPLOY_KEY }}
      - name: Prepare card images
        if: steps.images.outputs.available == 'true'
        run: go generate ./pkg/card_db/images
      - name: Test card data with embedded images
        if: steps.images.outputs.available == 'true'
        working-directory: pkg/card_db
        run: go test -v -tags "embed cardimages" -run 'TestEmbedded|TestFS' ./...
      - name: Test app asset loading with embedded images
        if: steps.images.outputs.available == 'true'
        run: go test -v -tags "embed cardimages" ./internal/assets/

  go-lint:
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Lint every module
        run: make lint TAGS=webkit2_41

  wasm:
    name: Engine for WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make wasm

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The release server archives (8.17); Linux binaries must be static,
  # so they run on Alpine (the Dockerfile).
  server:
    name: Server archives
    needs: [go, go-lint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Build and pack
        run: release/server.sh "ci-${{ github.sha }}" dist
      - name: Linux servers are static
        run: |
          for arch in amd64 arm64; do
            tar -xzf "dist/four-souls-server-linux-$arch.tar.gz" -C dist
            info=$(file "dist/four-souls-server-linux-$arch/four_souls_server")
            echo "$info"
            [[ "$info" == *"statically linked"* ]]
          done
      - uses: actions/upload-artifact@v4
        with:
          name: four-souls-server
          path: dist/*.*
          retention-days: 7

  app:
    name: App ${{ matrix.target.name }} ${{ matrix.images && 'with images' || 'text only' }}
    needs: [go, go-lint, frontend]
    strategy:
      fail-fast: false
      matrix:
        images: [false, true]
        target:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            tags: ""
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            tags: ""
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Card images
        id: images
        if: matrix.images
        uses: ./.github/actions/card-images
        with:
          ssh-key: ${{ secrets.CARD_DB_DEPLOY_KEY }}
      # With images requested but no key, the job ends here as a no-op.
      - name: Decide build
        id: build
        shell: bash
        run: |
          if [ "${{ matrix.images }}" = "true" ] && [ "${{ steps.images.outputs.available }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ matrix.images }}" = "true" ]; then
            echo "tags=embed cardimages ${{ matrix.target.tags }}" >> "$GITHUB_OUTPUT"
            echo "suffix=with-images" >> "$GITHUB_OUTPUT"
          else
            echo "tags=embed ${{ matrix.target.tags }}" >> "$GITHUB_OUTPUT"
            echo "suffix=text-only" >> "$GITHUB_OUTPUT"
          fi
      - name: Build app
        if: steps.build.outputs.run == 'true'
        uses: ./.github/actions/build
        with:
          platform: ${{ matrix.target.platform }}
          tags: ${{ steps.build.outputs.tags }}
          version: ci-${{ github.sha }}
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.run == 'true'
        with:
          name: four-souls-${{ matrix.target.name }}-${{ steps.build.outputs.suffix }}
          path: build/bin/
          retention-days: 7
