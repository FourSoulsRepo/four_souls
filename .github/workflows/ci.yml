name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  WAILS_VERSION: "v2.16.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        run: make build TAGS=webkit2_41
      - name: Vet
        run: make vet TAGS=webkit2_41
      - name: Test
        run: make test TAGS=webkit2_41

  go-lint:
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: Lint every module
        run: make lint TAGS=webkit2_41

  wasm:
    name: Engine for WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - run: make wasm

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  app:
    name: App ${{ matrix.name }}
    needs: [go, go-lint, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            goos: linux
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: webkit2_41
            goos: linux
            goarch: arm64
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
            goos: windows
            goarch: amd64
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            tags: ""
            goos: windows
            goarch: arm64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            tags: ""
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build app
        shell: bash
        run: |
          tags="embed ${{ matrix.tags }}"
          wails build -platform ${{ matrix.platform }} -tags "$tags" \
            -ldflags "-X github.com/FourSoulsRepo/four_souls/internal/version.App=ci-${GITHUB_SHA::7}"
      - name: Build server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags embed -o build/bin/ ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: four-souls-${{ matrix.name }}
          path: build/bin/
          retention-days: 7
