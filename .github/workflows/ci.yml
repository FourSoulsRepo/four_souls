name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  WAILS_VERSION: "v2.16.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        run: make build TAGS=webkit2_41
      - name: Vet
        run: make vet TAGS=webkit2_41
      - name: Test
        run: make test TAGS=webkit2_41

  go-images:
    name: Go tests with card images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Card images
        id: images
        uses: ./.github/actions/card-images
        with:
          ssh-key: ${{ secrets.CARD_DB_DEPLOY_KEY }}
      - name: Test card data with embedded images
        if: steps.images.outputs.available == 'true'
        working-directory: pkg/card_db
        run: go test -v -tags "embed cardimages" -run TestEmbedded ./...
      - name: Test app asset loading with embedded images
        if: steps.images.outputs.available == 'true'
        run: go test -v -tags "embed cardimages" ./internal/assets/

  go-lint:
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install golangci-lint
        env:
          # v2.14 needs Go 1.26 to build; setup-go pins GOTOOLCHAIN=local.
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Lint every module
        run: make lint TAGS=webkit2_41

  wasm:
    name: Engine for WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - run: make wasm

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  app:
    name: App ${{ matrix.target.name }} ${{ matrix.images && 'with images' || 'text only' }}
    needs: [go, go-lint, frontend]
    strategy:
      fail-fast: false
      matrix:
        images: [false, true]
        target:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            goos: linux
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: webkit2_41
            goos: linux
            goarch: arm64
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
            goos: windows
            goarch: amd64
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            tags: ""
            goos: windows
            goarch: arm64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            tags: ""
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Card images
        id: images
        if: matrix.images
        uses: ./.github/actions/card-images
        with:
          ssh-key: ${{ secrets.CARD_DB_DEPLOY_KEY }}
      # With images requested but no key, the job ends here as a no-op.
      - name: Decide build
        id: build
        shell: bash
        run: |
          if [ "${{ matrix.images }}" = "true" ] && [ "${{ steps.images.outputs.available }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ matrix.images }}" = "true" ]; then
            echo "tags=embed cardimages ${{ matrix.target.tags }}" >> "$GITHUB_OUTPUT"
            echo "suffix=with-images" >> "$GITHUB_OUTPUT"
          else
            echo "tags=embed ${{ matrix.target.tags }}" >> "$GITHUB_OUTPUT"
            echo "suffix=text-only" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.build.outputs.run == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v5
        if: steps.build.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails Linux dependencies
        if: steps.build.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        if: steps.build.outputs.run == 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build app
        if: steps.build.outputs.run == 'true'
        shell: bash
        run: |
          wails build -platform ${{ matrix.target.platform }} -tags "${{ steps.build.outputs.tags }}" \
            -ldflags "-X github.com/FourSoulsRepo/four_souls/internal/version.App=ci-${GITHUB_SHA::7}"
      - name: Build server
        if: steps.build.outputs.run == 'true'
        shell: bash
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -tags "${{ steps.build.outputs.tags }}" -o build/bin/ ./cmd/server
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.run == 'true'
        with:
          name: four-souls-${{ matrix.target.name }}-${{ steps.build.outputs.suffix }}
          path: build/bin/
          retention-days: 7
