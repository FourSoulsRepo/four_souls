# Four Souls dedicated server behind Caddy, with HTTPS (8.20).
#
# Put this file, Dockerfile, Caddyfile and .env.example in one folder:
#
#   cp .env.example .env      # then set DOMAIN in .env
#   docker compose up -d --build
#
# Players type only the domain; the app connects with wss:// (ADR 017).
# Update to the newest release: docker compose up -d --build
# (wiki page "Server with Docker Compose and Caddy").
name: four-souls

services:
  server:
    build: .
    image: four-souls-server
    restart: unless-stopped
    # Empty values count as unset: the server's defaults stay.
    environment:
      FOUR_SOULS_NAME: ${FOUR_SOULS_NAME:-}
      FOUR_SOULS_RETENTION: ${FOUR_SOULS_RETENTION:-}
      FOUR_SOULS_PRESENCE: ${FOUR_SOULS_PRESENCE:-}
      FOUR_SOULS_EMPTY_MINUTES: ${FOUR_SOULS_EMPTY_MINUTES:-}
      FOUR_SOULS_GAME_HOURS: ${FOUR_SOULS_GAME_HOURS:-}
    volumes:
      - data:/data
    # Only Caddy reaches it. To let players also join without HTTPS
    # (ws:// on 4774), uncomment and open the port in the firewall.
    # ports:
    #   - "4774:4774"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4774/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # On SIGTERM the server keeps its games in /data within a second;
    # the next start goes on with them (N-20).
    stop_grace_period: 15s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
